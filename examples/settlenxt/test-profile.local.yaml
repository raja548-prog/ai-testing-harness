# Same product, wired to fake adapters so the full pipeline runs on a laptop or in CI.
apiVersion: ainxt.io/test-profile/v1
product: settlenxt
owners: [settlement-dept]
repos: { code: "local" }
build:  { adapter: fake-pipeline }
deploy: { adapter: fake-pipeline }
suites:
  - id: smoke
    executor: { adapter: fake-executor, fixtures: tests/fixtures }
    results:  { format: junit-xml }
    maxDurationMin: 15
  - id: regression
    executor: { adapter: fake-executor, fixtures: tests/fixtures }
    results:  { format: junit-xml }
    maxDurationMin: 180
selection:
  default: [smoke]
  rules:
    - when: { pathsChanged: ["**/clearing/**"] }
      run:  [smoke, regression]
logs:
  sources:
    - { adapter: log-api, keys: [rrn, stan, batchId] }   # no endpoint: falls back to the next source
    - { adapter: fake-logs }
policy:
  flakyRetries: 2
  environments: [uat1]
  envLock: { adapter: fake-lock, env: uat1, waitMaxMin: 1 }
  knownFailures:
    - { caseId: SNX-004, ticket: SNX-1790, expires: "2099-12-31" }
models: { default: local/onprem-coder }
