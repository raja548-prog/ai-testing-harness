[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ainxt-ath"
version = "0.1.0"
description = "AiNxt Test Harness (ATH): a product-agnostic agentic testing harness"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
ainxt-ath = "ath_cli.main:main"

[tool.setuptools.packages.find]
include = ["ath_core*", "ath_server*", "ath_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
