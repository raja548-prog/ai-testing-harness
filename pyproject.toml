[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ainxt-ath"
version = "0.1.0"
description = "AiNxt Test Harness (ATH): a product-agnostic agentic testing harness"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
ainxt-ath = "ath_cli.main:main"

[tool.setuptools.packages.find]
include = ["ath_core*", "ath_server*", "ath_cli*"]

# Skills, model policy and templates install to <prefix>/share/ainxt-ath/ (found by ath_core/assets.py).
# One entry per folder: data files are copied flat. tests/test_packaging.py fails if a folder is missing.
[tool.setuptools.data-files]
"share/ainxt-ath/config" = ["config/*.yaml"]
"share/ainxt-ath/skills/_shared" = ["skills/_shared/*.md"]
"share/ainxt-ath/skills/t01-impact" = ["skills/t01-impact/*.md"]
"share/ainxt-ath/skills/t03-author" = ["skills/t03-author/*.md"]
"share/ainxt-ath/skills/t07-triage" = ["skills/t07-triage/*.md"]
"share/ainxt-ath/skills/t10-remediate" = ["skills/t10-remediate/*.md"]
"share/ainxt-ath/skills/t11-validate" = ["skills/t11-validate/*.md"]
"share/ainxt-ath/templates/product-package" = ["templates/product-package/*.md", "templates/product-package/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
