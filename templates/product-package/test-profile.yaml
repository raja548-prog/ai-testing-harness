# Generated at onboarding (Agent Studio). Replace every <placeholder>.
# Validate with: ainxt-ath doctor test-profile.yaml
apiVersion: ainxt.io/test-profile/v1
product: <product-id>
owners: [<department-group>]
repos:
  code:  <git-url-of-code-repo>
  tests: <git-url-of-test-repo>

build:  { adapter: <gitlab-pipeline|jenkins-job>, project: <ci-project> }
deploy:
  adapter: <jenkins-job|gitlab-pipeline>
  # jenkins-job: your own Jenkins. Secrets are env:NAME references, never values.
  baseUrl: <https://jenkins.your-dept.internal>
  job: <cd-job>                                  # folders as folder/job
  trigger: webhook                               # webhook (Generic Webhook Trigger) | api
  webhookTokenRef: env:<PRODUCT>_JENKINS_WEBHOOK_TOKEN
  user: <jenkins-user-with-read-access>
  tokenRef: env:<PRODUCT>_JENKINS_API_TOKEN
  params: { COMMIT_ID: "${commit}", ENV: <uat-env> }
  healthCheck: { url: <health-url>, expect: 200, timeoutSec: 600 }

suites:
  - id: smoke
    executor:
      adapter: <jenkins-job|test-server-api|simulator>
      # jenkins-job: same baseUrl/trigger/webhookTokenRef/user/tokenRef as deploy, plus:
      job: <smoke-job>
      params: { COMMIT_ID: "${commit}", ENV: "${env}" }
      collect: test-report                       # test-report | artifacts (then set artifacts: <glob>)
    results:  { format: <jenkins-test-report|junit-xml|allure-json|cucumber-json|custom> }
    maxDurationMin: 15

selection:
  default: [smoke]
  rules: []

testAuthoring:
  mode: <git-mr|test-server-api|simulator-scenarios>
  conventions: skills/<product>-test-conventions.md

logs:
  sources:
    - { adapter: log-api, endpoint: <log-api-url>, keys: [<rrn>, <stan>] }   # preferred
  masking: [pan, cvv, track2, aadhaar, mobile]

policy:
  flakyRetries: 2
  maxFixIterations: 3
  environments: [<uat-env>]
  envLock: { adapter: <dept-env-booking>, env: <uat-env>, waitMaxMin: 120 }
  knownFailures: []

models:
  default: local/<approved-model>
