<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" style="background:#ffffff" viewBox="0 0 760 560" role="img" aria-label="Eleven stages in four phases; humans approve every change" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3acb9"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#17202c">Eleven stages in four phases; humans approve every change</text><g fill="none" stroke="#a3acb9" stroke-width="1.25"><path d="M344 96H372" marker-end="url(#pipe-arrow)"></path><path d="M540 96H568" marker-end="url(#pipe-arrow)"></path><path d="M652 132V152H260V172" marker-end="url(#pipe-arrow)"></path><path d="M344 208H372" marker-end="url(#pipe-arrow)"></path><path d="M540 208H568" marker-end="url(#pipe-arrow)"></path><path d="M652 244V264H260V284" marker-end="url(#pipe-arrow)"></path><path d="M344 320H372" marker-end="url(#pipe-arrow)"></path><path d="M540 320H568" marker-end="url(#pipe-arrow)"></path><path d="M652 356V376H260V396" marker-end="url(#pipe-arrow)"></path><path d="M344 432H372" marker-end="url(#pipe-arrow)"></path><path d="M540 432H568" marker-end="url(#pipe-arrow)"></path><path d="M456 468V492H260V468" marker-end="url(#pipe-arrow)"></path></g><text x="24" y="92" font-weight="600" fill="#17202c">Phase 1</text><text x="24" y="110" font-size="11.5" fill="#556070">Understand</text><text x="24" y="204" font-weight="600" fill="#17202c">Phase 2</text><text x="24" y="222" font-size="11.5" fill="#556070">Execute</text><text x="24" y="316" font-weight="600" fill="#17202c">Phase 3</text><text x="24" y="334" font-size="11.5" fill="#556070">Analyse</text><text x="24" y="428" font-weight="600" fill="#17202c">Phase 4</text><text x="24" y="446" font-size="11.5" fill="#556070">Fix and validate</text><rect x="176" y="60" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="260" y="84" text-anchor="middle" font-weight="600" fill="#17202c">T1 Impact map</text><text x="260" y="100" text-anchor="middle" font-size="11.5" fill="#556070">diff + TSD + product</text><text x="260" y="116" text-anchor="middle" font-size="11.5" fill="#556070">skill → affected areas</text></g><rect x="372" y="60" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="456" y="84" text-anchor="middle" font-weight="600" fill="#17202c">T2 Test selection</text><text x="456" y="100" text-anchor="middle" font-size="11.5" fill="#556070">profile rules + impact</text><text x="456" y="116" text-anchor="middle" font-size="11.5" fill="#556070">→ suites and cases</text></g><rect x="568" y="60" width="168" height="72" rx="8" fill="#1f6fd6" fill-opacity="0.12" stroke="#1f6fd6" stroke-width="2"></rect><g><text x="652" y="84" text-anchor="middle" font-weight="600" fill="#17202c">T3 Test authoring</text><text x="652" y="100" text-anchor="middle" font-size="11.5" fill="#556070">new or updated cases</text><text x="652" y="116" text-anchor="middle" font-size="11.5" fill="#556070">via TestAuthor</text></g><rect x="176" y="172" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="260" y="196" text-anchor="middle" font-weight="600" fill="#17202c">T4 Env readiness</text><text x="260" y="212" text-anchor="middle" font-size="11.5" fill="#556070">commit deployed?</text><text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#556070">health checks pass</text></g><rect x="372" y="172" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="456" y="196" text-anchor="middle" font-weight="600" fill="#17202c">T5 Execute</text><text x="456" y="212" text-anchor="middle" font-size="11.5" fill="#556070">run suites; baseline</text><text x="456" y="228" text-anchor="middle" font-size="11.5" fill="#556070">run on target branch</text></g><rect x="568" y="172" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="652" y="196" text-anchor="middle" font-weight="600" fill="#17202c">T6 Normalize</text><text x="652" y="212" text-anchor="middle" font-size="11.5" fill="#556070">parse to ATRF,</text><text x="652" y="228" text-anchor="middle" font-size="11.5" fill="#556070">mask sensitive data</text></g><rect x="176" y="284" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="260" y="308" text-anchor="middle" font-weight="600" fill="#17202c">T7 Triage</text><text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#556070">baseline, retry, then</text><text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#556070">3 agents classify</text></g><rect x="372" y="284" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="456" y="308" text-anchor="middle" font-weight="600" fill="#17202c">T8 Verify</text><text x="456" y="324" text-anchor="middle" font-size="11.5" fill="#556070">2-of-3 vote, evidence</text><text x="456" y="340" text-anchor="middle" font-size="11.5" fill="#556070">check per failure</text></g><rect x="568" y="284" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="652" y="308" text-anchor="middle" font-weight="600" fill="#17202c">T9 Report</text><text x="652" y="324" text-anchor="middle" font-size="11.5" fill="#556070">Markdown + ATRF</text><text x="652" y="340" text-anchor="middle" font-size="11.5" fill="#556070">on MR and Jira</text></g><text x="456" y="371" text-anchor="middle" font-size="11.5" fill="#556070">report-only stops after T9; assist continues</text><rect x="176" y="396" width="168" height="72" rx="8" fill="#1f6fd6" fill-opacity="0.12" stroke="#1f6fd6" stroke-width="2"></rect><g><text x="260" y="420" text-anchor="middle" font-weight="600" fill="#17202c">T10 Remediate</text><text x="260" y="436" text-anchor="middle" font-size="11.5" fill="#556070">fix on ADLC branch,</text><text x="260" y="452" text-anchor="middle" font-size="11.5" fill="#556070">rebuild, redeploy</text></g><rect x="372" y="396" width="168" height="72" rx="8" fill="#1f6fd6" fill-opacity="0.12" stroke="#1f6fd6" stroke-width="2"></rect><g><text x="456" y="420" text-anchor="middle" font-weight="600" fill="#17202c">T11 Validate</text><text x="456" y="436" text-anchor="middle" font-size="11.5" fill="#556070">rerun, then panel</text><text x="456" y="452" text-anchor="middle" font-size="11.5" fill="#556070">scores the fix</text></g><rect x="568" y="396" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#a3acb9" stroke-width="1.25"></rect><g><text x="652" y="420" text-anchor="middle" font-weight="600" fill="#17202c">Verdict</text><text x="652" y="436" text-anchor="middle" font-size="11.5" fill="#556070">validated, failed,</text><text x="652" y="452" text-anchor="middle" font-size="11.5" fill="#556070">or needs_review</text></g><text x="358" y="510" text-anchor="middle" font-size="11.5" fill="#556070">validation_failed: fix again, up to maxFixIterations</text><rect x="24" y="528" width="16" height="12" rx="3" fill="#1f6fd6" fill-opacity="0.12" stroke="#1f6fd6" stroke-width="2"></rect><text x="48" y="538" font-size="11.5" fill="#556070">HITL gate: a human approves before the stage acts</text></svg>